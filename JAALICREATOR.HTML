<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mughal Pattern Creator — PhD Thesis Appendix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #FAF8F5; font-family: 'Inter', system-ui, -apple-system, sans-serif; color: #1C1917; }
    </style>
</head>
<body class="p-6 md:p-10 min-h-screen flex flex-col justify-between">
    <div class="max-w-6xl mx-auto w-full">
        <div class="flex items-center justify-between mb-8 border-b border-stone-200 pb-4">
            <div>
                <span class="text-xs font-bold tracking-widest text-amber-800 uppercase bg-amber-50 border border-amber-200 px-3 py-1 rounded-full">System 03</span>
                <h1 class="text-2xl md:text-3xl font-bold text-stone-900 mt-2">Mughal Pattern Creator</h1>
            </div>
            <a href="index.html" class="text-xs font-semibold bg-stone-900 text-white px-4 py-2 rounded-xl hover:bg-stone-800 transition-all">&larr; Back to Dashboard</a>
        </div>
        
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-start">
            <!-- CANVAS CONTAINER -->
            <div class="lg:col-span-2 bg-white p-6 rounded-2xl border border-stone-200 shadow-sm flex flex-col items-center justify-center min-h-[520px]">
                <canvas id="jaaliCanvas" width="600" height="600" class="w-full h-auto max-w-[500px] border border-stone-200 rounded-xl bg-white shadow-sm"></canvas>
            </div>

            <!-- CONTROLS PANEL -->
            <div class="bg-white p-6 rounded-2xl border border-stone-200 shadow-sm space-y-6">
                <h2 class="text-base font-bold text-stone-900 border-b border-stone-100 pb-3">Customize Pattern Parameters</h2>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-stone-600 mb-2">Pattern Composition</label>
                    <select id="patternStyle" class="w-full p-2.5 border border-stone-300 rounded-xl text-sm bg-stone-50 focus:ring-2 focus:ring-amber-800 outline-none">
                        <option value="star">Hexagon & 6-Point Star (Mughal Jaali)</option>
                        <option value="octagon">Octagon & 8-Point Star</option>
                        <option value="grid">Square Lattice Screen</option>
                    </select>
                </div>

                <div>
                    <div class="flex justify-between text-xs font-semibold text-stone-600 mb-1">
                        <span>Void Size (S:V Ratio)</span>
                        <span id="voidVal" class="font-mono">0.75</span>
                    </div>
                    <input type="range" id="voidSize" min="0.2" max="0.9" step="0.05" value="0.75" class="w-full accent-amber-800">
                </div>

                <div>
                    <div class="flex justify-between text-xs font-semibold text-stone-600 mb-1">
                        <span>Scale / Density</span>
                        <span id="scaleVal" class="font-mono">80</span>
                    </div>
                    <input type="range" id="scaleDensity" min="40" max="140" step="10" value="80" class="w-full accent-amber-800">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-stone-600 mb-1">Solid Frame Color</label>
                        <input type="color" id="solidColor" value="#1c1917" class="w-full h-10 p-1 rounded-xl border border-stone-300 cursor-pointer">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-stone-600 mb-1">Void Opening Color</label>
                        <input type="color" id="voidColor" value="#ffffff" class="w-full h-10 p-1 rounded-xl border border-stone-300 cursor-pointer">
                    </div>
                </div>

                <button id="downloadBtn" class="w-full bg-amber-900 hover:bg-amber-950 text-white font-semibold py-3 px-4 rounded-xl text-sm transition-all shadow-sm">
                    Export Pattern as PNG
                </button>
            </div>
        </div>
    </div>

    <footer class="text-center text-xs text-stone-400 border-t border-stone-200 pt-6 mt-10">
        Department of Design, IIT Hyderabad &copy; 2026
    </footer>

    <script>
        const canvas = document.getElementById('jaaliCanvas');
        const ctx = canvas.getContext('2d');

        const patternStyle = document.getElementById('patternStyle');
        const voidSize = document.getElementById('voidSize');
        const scaleDensity = document.getElementById('scaleDensity');
        const solidColor = document.getElementById('solidColor');
        const voidColor = document.getElementById('voidColor');
        const voidVal = document.getElementById('voidVal');
        const scaleVal = document.getElementById('scaleVal');

        function drawPattern() {
            if (!ctx) return;
            const style = patternStyle.value;
            const vRatio = parseFloat(voidSize.value);
            const size = parseInt(scaleDensity.value);
            const sCol = solidColor.value;
            const vCol = voidColor.value;

            voidVal.textContent = vRatio.toFixed(2);
            scaleVal.textContent = size;

            ctx.fillStyle = sCol;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = vCol;
            ctx.strokeStyle = sCol;
            ctx.lineWidth = Math.max(2, size * (1 - vRatio) * 0.25);

            const cols = Math.ceil(canvas.width / size) + 2;
            const rows = Math.ceil(canvas.height / size) + 2;

            for (let r = -1; r < rows; r++) {
                for (let c = -1; c < cols; c++) {
                    const x = c * size + (r % 2 === 0 ? 0 : size / 2);
                    const y = r * (size * 0.866);

                    ctx.save();
                    ctx.translate(x, y);

                    if (style === 'star') {
                        drawStarPolygon(ctx, size * vRatio * 0.45, 6);
                    } else if (style === 'octagon') {
                        drawStarPolygon(ctx, size * vRatio * 0.45, 8);
                    } else {
                        const boxSize = size * vRatio * 0.6;
                        ctx.fillRect(-boxSize / 2, -boxSize / 2, boxSize, boxSize);
                        ctx.strokeRect(-boxSize / 2, -boxSize / 2, boxSize, boxSize);
                    }
                    ctx.restore();
                }
            }
        }

        function drawStarPolygon(ctx, radius, points) {
            ctx.beginPath();
            const innerRadius = radius * 0.5;
            for (let i = 0; i < points * 2; i++) {
                const r = i % 2 === 0 ? radius : innerRadius;
                const angle = (i * Math.PI) / points;
                const px = r * Math.cos(angle);
                const py = r * Math.sin(angle);
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        }

        [patternStyle, voidSize, scaleDensity, solidColor, voidColor].forEach(el => {
            if (el) {
                el.addEventListener('input', drawPattern);
                el.addEventListener('change', drawPattern);
            }
        });

        document.getElementById('downloadBtn').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'mughal_jaali_pattern.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });

        drawPattern();
        document.addEventListener('DOMContentLoaded', drawPattern);
    </script>
</body>
</html>
